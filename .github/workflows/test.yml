name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository secrets
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.28.0 detect --source=/repo --no-banner --redact
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: test -s LICENSE
      - run: go test ./...
      - run: go vet ./...
      - name: Scan Go dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - run: go run ./cmd/metis --help
      - name: Test npm launcher without network downloads
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          mkdir -p "$smoke_dir/node_modules/@vector-metis/cli-linux-x64"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "$smoke_dir/node_modules/@vector-metis/cli-linux-x64/bin-metis" ./cmd/metis
          NPM_PACKAGE_NAME='@vector-metis/cli-linux-x64' node npm/platform-package.mjs "$smoke_dir/node_modules/@vector-metis/cli-linux-x64" "$smoke_dir/node_modules/@vector-metis/cli-linux-x64/bin-metis" 0.1.1 metis
          cp npm/cli/bin/metis.js "$smoke_dir/metis.js"
          node "$smoke_dir/metis.js" --version
          npm pack npm/cli --pack-destination "$smoke_dir"
      - run: git diff --check
